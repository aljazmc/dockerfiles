name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Many scripts have no .sh extension (makesh, makedmg, bundle, ...),
      # so pick files by their shebang instead of by name.
      - name: Run shellcheck
        run: |
          git ls-files -z |
            while IFS= read -r -d '' f; do
              head -n1 "$f" | grep -qE '^#!.*/(env )?(ba|da|k)?sh\b' && printf '%s\0' "$f"
            done |
            xargs -0 -t shellcheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # every test with docker stubbed out; smoke_test.sh builds the real
      # images, so it runs before publishing instead. shellcheck comes with
      # the runner, for tests/regression_test.sh
      - name: Run tests
        run: |
          status=0
          for test in tests/*_test.sh; do
            [ "$test" = tests/smoke_test.sh ] && continue
            echo "==> $test"
            bash "$test" || status=1
          done
          exit "$status"
