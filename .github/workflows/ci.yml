name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Many scripts have no .sh extension (makesh, makedmg, bundle, ...),
      # so pick files by their shebang instead of by name.
      - name: Run shellcheck
        run: |
          git ls-files -z |
            while IFS= read -r -d '' f; do
              head -n1 "$f" | grep -qE '^#!.*/(env )?(ba|da|k)?sh\b' && printf '%s\0' "$f"
            done |
            xargs -0 -t shellcheck

  project-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run project test
        run: tests/project_test.sh
