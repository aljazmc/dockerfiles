name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Many scripts have no .sh extension (makesh, makedmg, bundle, ...),
      # so pick files by their shebang instead of by name.
      - name: Run shellcheck
        run: |
          git ls-files -z |
            while IFS= read -r -d '' f; do
              head -n1 "$f" | grep -qE '^#!.*/(env )?(ba|da|k)?sh\b' && printf '%s\0' "$f"
            done |
            xargs -0 -t shellcheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # every test with docker stubbed out; smoke_test.sh builds the real
      # images, so it runs before publishing instead. shellcheck comes with
      # the runner, for tests/regression_test.sh
      - name: Run tests
        run: |
          status=0
          for test in tests/*_test.sh; do
            [ "$test" = tests/smoke_test.sh ] && continue
            echo "==> $test"
            bash "$test" || status=1
          done
          exit "$status"

  # Checks every Dockerfile for misconfigurations with Trivy, without
  # building an image, so it takes seconds; fails on HIGH or CRITICAL.
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Dockerfiles for misconfigurations
        run: ./project.sh lint

  # Builds and smoke-tests only the images whose directory changed: in a
  # push, between the commit before it and the one pushed; in a pull
  # request, between its base and its head. Nothing is pushed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # the whole history, so the commit before a push of several is here
          fetch-depth: 0

      - name: Find the changed images
        id: changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          images=$(./project.sh changed "$BASE" HEAD | paste -sd' ')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Changed images: ${images:-none}"

      - name: Build and smoke-test the changed images
        if: steps.changed.outputs.images != ''
        env:
          IMAGES: ${{ steps.changed.outputs.images }}
        run: |
          read -ra images <<< "$IMAGES"
          tests/smoke_test.sh "${images[@]}"

      # The images the step above built: an SBOM of each, and every HIGH and
      # CRITICAL vulnerability with a fix listed, but only CRITICAL ones fail
      # the job; HIGH ones in upstream builds, like the packages bundled with
      # npm, wait for a release that no push here can make.
      - name: Scan the changed images
        if: steps.changed.outputs.images != ''
        env:
          IMAGES: ${{ steps.changed.outputs.images }}
          IGNORE_UNFIXED: "1"
          FAIL_ON: CRITICAL
        run: |
          read -ra images <<< "$IMAGES"
          ./project.sh scan "${images[@]}"

      - name: Keep the SBOMs
        if: always() && steps.changed.outputs.images != ''
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: ignore
